<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1b06" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b0e17" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Outer Dial Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-dasharray="8 12" stroke-opacity="0.4" />
  
  <!-- Outer Solid Reticle Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGradient)" stroke-width="4.5" filter="url(#amberGlow)" />
  
  <!-- Inner Concentric Ring -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-opacity="0.75" />

  <!-- Subtle Diamond Center Guide -->
  <polygon points="256,196 316,256 256,316 196,256" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Crosshair Blades / Reticle Lines -->
  <!-- Top -->
  <line x1="256" y1="56" x2="256" y2="180" stroke="url(#goldGradient)" stroke-width="4.5" stroke-linecap="round" />
  <polygon points="256,186 251,166 261,166" fill="url(#goldGradient)" />
  <!-- Bottom -->
  <line x1="256" y1="332" x2="256" y2="456" stroke="url(#goldGradient)" stroke-width="4.5" stroke-linecap="round" />
  <polygon points="256,326 251,346 261,346" fill="url(#goldGradient)" />
  <!-- Left -->
  <line x1="56" y1="256" x2="180" y2="256" stroke="url(#goldGradient)" stroke-width="4.5" stroke-linecap="round" />
  <polygon points="186,256 166,251 166,261" fill="url(#goldGradient)" />
  <!-- Right -->
  <line x1="332" y1="256" x2="456" y2="256" stroke="url(#goldGradient)" stroke-width="4.5" stroke-linecap="round" />
  <polygon points="326,256 346,251 346,261" fill="url(#goldGradient)" />

  <!-- Cardinal Tick Marks -->
  <circle cx="256" cy="116" r="3.5" fill="#fde68a" />
  <circle cx="256" cy="396" r="3.5" fill="#fde68a" />
  <circle cx="116" cy="256" r="3.5" fill="#fde68a" />
  <circle cx="396" cy="256" r="3.5" fill="#fde68a" />

  <!-- Corner Notch Crosshairs -->
  <line x1="148" y1="148" x2="170" y2="170" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="364" y1="148" x2="342" y2="170" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="148" y1="364" x2="170" y2="342" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="364" y1="364" x2="342" y2="342" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Center Target Core -->
  <circle cx="256" cy="256" r="14" fill="#0b0e17" stroke="url(#goldGradient)" stroke-width="3.5" />
  <circle cx="256" cy="256" r="5" fill="#fde68a" />
</svg>
